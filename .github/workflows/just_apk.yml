name: Build APK Only

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install base deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 unzip zip curl openjdk-17-jdk ninja-build

      # ⬇⬇⬇ ВАЖНО: ставим depot_tools (даёт gn и autoninja) и добавляем в PATH
      - name: Install depot_tools (gn, autoninja)
        run: |
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$GITHUB_WORKSPACE/depot_tools"
          echo "$GITHUB_WORKSPACE/depot_tools" >> "$GITHUB_PATH"
          
      - name: Bootstrap depot_tools
        env:
          DEPOT_TOOLS_UPDATE: 1
          DEPOT_TOOLS_METRICS: 0
        run: |
          python3 "$GITHUB_WORKSPACE/depot_tools/update_depot_tools" || true
          gclient --version

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk: 26.1.10909125
          cmake: 3.22.1

      - name: Generate args.gn
        run: |
          mkdir -p out/Default
          cat > out/Default/args.gn <<'EOF'
          target_os = "android"
          target_cpu = "arm64"
          is_official_build = true
          is_debug = false
          symbol_level = 0
          use_goma = false
          ffmpeg_branding = "Chrome"
          proprietary_codecs = true
          enable_widevine = true
          EOF

      - name: gn gen
        working-directory: src
        run: gn gen out/Default
        

      - name: Build APK
        working-directory: src
        run: autoninja -C out/Default chrome_public_apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrome_public_apk
          path: out/Default/apks/**/*.apk
